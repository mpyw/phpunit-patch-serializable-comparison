name: Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [5.3, 5.4, 5.5, 5.6, '7.0', 7.1, 7.2, 7.3, 7.4, '8.0', 8.1, 8.2, 8.3, 8.4, 8.5]
        flags: ['']
        include:
          - { php: 5.3, flags: --prefer-lowest }
          - { php: 5.4, flags: --prefer-lowest }
          - { php: 5.5, flags: --prefer-lowest }
          - { php: 5.6, flags: --prefer-lowest }
          - { php: '7.0', flags: --prefer-lowest }
          - { php: 7.1, flags: --prefer-lowest }
          # Explicitly exercise the sebastian/comparator 8.0 / 8.1 range — the
          # versions that still lack the #158 serialization fix and therefore
          # still need this patch (requires PHP >= 8.4).
          - { php: 8.4, comparator: 8.0.* }
          - { php: 8.5, comparator: 8.1.* }

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Pin sebastian/comparator
        if: ${{ matrix.comparator }}
        run: composer require "sebastian/comparator:${{ matrix.comparator }}" --no-update

      - run: composer require phpunit/phpunit --dev ${{ matrix.flags }} ${{ matrix.comparator && '-W' || '' }}
      - run: composer show | grep -E '^(phpunit/phpunit|sebastian/comparator|sebastian/diff)'
      - run: 'vendor/bin/phpunit --migrate-configuration || :'
      - run: vendor/bin/phpunit
